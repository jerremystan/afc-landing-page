<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOP Slasher - AFC Game</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body {
            margin: 0; padding: 0; background: #0f172a; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-wrapper {
            width: 100%; max-width: 380px; background: #1e293b; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 2px solid #fbbf24;
            overflow: hidden; display: flex; flex-direction: column; position: relative;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: #0f172a;
            font-size: 11px; font-weight: bold; border-bottom: 2px solid #fbbf24; z-index: 25;
        }
        .btn-back-in {
            background: rgba(56, 189, 248, 0.15); color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4); padding: 3px 8px;
            font-size: 10px; font-weight: bold; border-radius: 4px;
            text-decoration: none; transition: transform 0.1s;
        }
        .btn-back-in:active { transform: scale(0.95); }

        .text-gold { color: #fbbf24; text-shadow: 1px 1px 2px #000; }
        .text-red { color: #ef4444; text-shadow: 1px 1px 2px #000; }
        #rank-title { color: #38bdf8; font-size: 10px; background: rgba(56,189,248,0.15); padding: 2px 5px; border-radius: 4px; border: 1px solid rgba(56,189,248,0.3); }

        #gameCanvas {
            display: block; background: radial-gradient(circle at top, #1e293b, #040812);
            cursor: crosshair; width: 100%; height: 490px;
        }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); z-index: 30;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 15px 20px;
        }
        h1 { color: #38bdf8; margin-bottom: 2px; font-size: 26px; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
        
        .welcome-rank {
            color: #38bdf8; font-size: 12px; font-weight: bold; margin-bottom: 4px;
            text-shadow: 0 0 8px rgba(56,189,248,0.3);
        }

        .high-score-box {
            background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fbbf24; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold;
            margin-bottom: 12px;
        }

        .tutorial-box {
            background: rgba(15, 23, 42, 0.8); border: 1px solid #475569; border-radius: 8px;
            padding: 10px; margin-bottom: 15px; width: 100%; text-align: left; font-size: 11px; line-height: 1.4; color: #cbd5e1;
        }
        .tutorial-box b { color: #fbbf24; }
        
        .btn-start {
            background: linear-gradient(to bottom, #f59e0b, #d97706);
            color: white; border: 2px solid #fbbf24; padding: 10px 30px; font-size: 16px; font-weight: bold;
            border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.5);
        }
        .btn-start:active { transform: scale(0.95); }

        #damage-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(239, 68, 68, 0.4); z-index: 20;
            opacity: 0; pointer-events: none; transition: opacity 0.1s;
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div class="header">
            <a href="#" onclick="if (document.referrer) { history.back(); } else { window.location.href = 'index.html'; } return false;" class="btn-back-in">⬅ Kembali</a>
            <div>Gelar: <span id="rank-title">Toreda</span></div>
            <div>Skor: <span id="score" class="text-gold">0</span></div>
            <div>❤️ <span id="lives" class="text-red">4</span></div>
        </div>

        <div style="position: relative;">
            <canvas id="gameCanvas" width="380" height="490"></canvas>
            <div id="damage-flash"></div>
            
            <div id="ui-overlay">
                <h1>SOP SLASHER</h1>
                
                <!-- Sapaan Gelar Tertinggi di Menu Utama -->
                <div class="welcome-rank" id="menu-welcome-rank">Welcome, Toreda!</div>
                
                <div class="high-score-box">
                    🏆 High Score: <span id="menu-high-score">0</span>
                </div>
                
                <div class="tutorial-box">
                    <div>⚔️ <b>CARA MAIN:</b> Swipe jari untuk menebas cepat!</div>
                    <div style="margin-top: 4px;">⚠️ <b>PERATURAN:</b></div>
                    <div style="margin-left: 10px; color: #60a5fa;">• Jangan tebas Sachet SOP (Biru Tua)</div>
                    <div style="margin-left: 10px; color: #c084fc;">• Jangan tebas Sachet Utsu (Ungu Tua)</div>
                    <div style="margin-top: 4px; color: #ef4444;"> Nahan kursor / diam menunggu musuh tidak akan menghitung combo!</div>
                </div>

                <button class="btn-start" id="startBtn">Mulai Tebas ⚔️</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const rankDisplay = document.getElementById('rank-title');
        const overlay = document.getElementById('ui-overlay');
        const startBtn = document.getElementById('startBtn');
        const flash = document.getElementById('damage-flash');
        const menuHighScoreDisplay = document.getElementById('menu-high-score');
        const menuWelcomeRank = document.getElementById('menu-welcome-rank');

        let isPlaying = false;
        let gameLoop;
        let score = 0;
        let lives = 4;
        let frameCount = 0;

        let targets = [];
        let particles = [];
        let floatTexts = [];
        let trails = [];
        
        let isSwiping = false;
        let swipePath = [];
        
        let comboCount = 0;
        let lastSlashTime = 0;
        const COMBO_TIMEOUT = 400;

        let savedHighScore = localStorage.getItem('sopSlasherHighScore') || 0;
        menuHighScoreDisplay.innerText = savedHighScore;

        function getRank(s) {
            if (s >= 1200) return "Bushido";
            if (s >= 1050) return "Daimyo";
            if (s >= 701)  return "Shogun";
            if (s >= 351)  return "Samurai";
            if (s >= 121)  return "Ronin";
            return "Toreda";
        }

        // Set sapaan awal berdasarkan High Score yang tersimpan
        updateMenuWelcomeRank(savedHighScore);

        function updateMenuWelcomeRank(s) {
            let currentRank = getRank(s);
            if (menuWelcomeRank) {
                menuWelcomeRank.innerText = `Welcome, ${currentRank}!`;
            }
        }

        const targetTypes = [
            { id: 'kolesterol', label: 'KOLESTEROL', w: 75, h: 40, c1: '#f97316', c2: '#9a3412', border: '#fdba74', type: 'enemy', textColor: '#fff' },
            { id: 'asamurat', label: 'ASAM URAT', w: 55, h: 55, c1: '#10b981', c2: '#047857', border: '#6ee7b7', type: 'enemy', textColor: '#fff' },
            { id: 'guladarah', label: 'GULA DARAH', w: 70, h: 45, c1: '#ef4444', c2: '#991b1b', border: '#fca5a5', type: 'enemy', textColor: '#fff' },
            { id: 'hipertensi', label: 'HIPERTENSI', w: 70, h: 45, c1: '#38bdf8', c2: '#0284c7', border: '#bae6fd', type: 'enemy', textColor: '#fff' }, 
            { id: 'sop', label: 'SOP', w: 45, h: 60, c1: '#1d4ed8', c2: '#111827', border: '#60a5fa', type: 'friendly', textColor: '#fbbf24' }, 
            { id: 'utsu', label: 'UTSU', w: 45, h: 60, c1: '#581c87', c2: '#2e1065', border: '#d8b4fe', type: 'friendly', textColor: '#fbbf24' }  
        ];

        function drawRoundRect(ctx, x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function drawOrganicShape(ctx, radiusX, radiusY, wobbleOffset) {
            ctx.beginPath();
            let points = 20;
            for (let i = 0; i <= points; i++) {
                let angle = (i / points) * Math.PI * 2;
                let wobble = Math.sin(angle * 4 + wobbleOffset) * 4; 
                let x = Math.cos(angle) * (radiusX + wobble);
                let y = Math.sin(angle) * (radiusY + wobble);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
        }

        function getPos(e) {
            let rect = canvas.getBoundingClientRect();
            if (e.touches) return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function startSwipe(e) {
            if (!isPlaying) return;
            isSwiping = true;
            swipePath = [getPos(e)];
        }

        function moveSwipe(e) {
            if (!isPlaying || !isSwiping) return;
            let pos = getPos(e);
            
            let lastPos = swipePath[swipePath.length - 1];
            let moveDist = Math.hypot(pos.x - lastPos.x, pos.y - lastPos.y);

            if (moveDist < 2) return;

            swipePath.push(pos);
            if (swipePath.length > 10) swipePath.shift(); 
            checkSlashCollision(lastPos, pos);
        }

        function endSwipe() {
            isSwiping = false;
            swipePath = [];
            finalizeCombo();
        }

        function finalizeCombo() {
            if (comboCount > 1) {
                score += (comboCount * 5); 
                updateScoreAndRank();
                createFloatText(`COMBO x${comboCount}!`, 190, 240, '#fbbf24');
            }
            comboCount = 0;
        }

        canvas.addEventListener('mousedown', startSwipe);
        canvas.addEventListener('mousemove', moveSwipe);
        window.addEventListener('mouseup', endSwipe);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startSwipe(e); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); moveSwipe(e); }, {passive: false});
        window.addEventListener('touchend', endSwipe);

        function distToSegment(px, py, x1, y1, x2, y2) {
            let dx = x2 - x1, dy = y2 - y1;
            let lenSq = dx * dx + dy * dy;
            if (lenSq === 0) return Math.hypot(px - x1, py - y1);
            let t = Math.max(0, Math.min(1, ((px - x1) * dx + (py - y1) * dy) / lenSq));
            return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
        }

        function checkSlashCollision(p1, p2) {
            if (!p1 || !p2) return;
            let now = Date.now();

            for (let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                let dist = distToSegment(t.x, t.y, p1.x, p1.y, p2.x, p2.y);
                
                let hitRadius = Math.max(t.width, t.height) / 2;
                if (dist < hitRadius) { 
                    if (t.type === 'enemy') {
                        score += 10;
                        updateScoreAndRank();
                        createExplosion(t.x, t.y, t.c1);
                        
                        if (now - lastSlashTime < COMBO_TIMEOUT) {
                            comboCount++;
                        } else {
                            finalizeCombo(); 
                            comboCount = 1;
                        }
                        lastSlashTime = now;

                    } else {
                        takeDamage();
                        createFloatText("JANGAN DITEBAS!", t.x, t.y, '#ef4444');
                        createExplosion(t.x, t.y, '#ef4444');
                        comboCount = 0; 
                    }
                    targets.splice(i, 1);
                }
            }
        }

        function updateScoreAndRank() {
            scoreDisplay.innerText = score;
            rankDisplay.innerText = getRank(score);
        }

        startBtn.addEventListener('click', startGame);

        function startGame() {
            targets = []; particles = []; floatTexts = []; trails = [];
            score = 0; lives = 4; frameCount = 0; comboCount = 0; lastSlashTime = 0;
            updateScoreAndRank();
            livesDisplay.innerText = lives;
            overlay.style.display = 'none';
            isPlaying = true;
            if (gameLoop) cancelAnimationFrame(gameLoop);
            gameLoop = requestAnimationFrame(update);
        }

        function spawnTarget() {
            let isEnemy = Math.random() > 0.25; 
            let typePool = targetTypes.filter(t => t.type === (isEnemy ? 'enemy' : 'friendly'));
            let tData = typePool[Math.floor(Math.random() * typePool.length)];
            
            let x = Math.random() * 260 + 60; 
            let vx = (Math.random() - 0.5) * 4; 
            let vy = -(Math.random() * 4 + 11); 
            
            let rotSpeed = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 0.12 + 0.05);

            targets.push({
                id: tData.id,
                x: x, y: 490, vx: vx, vy: vy,
                width: tData.w, height: tData.h,
                label: tData.label, c1: tData.c1, c2: tData.c2, border: tData.border, type: tData.type, textColor: tData.textColor,
                rotation: 0, rotSpeed: rotSpeed
            });
        }

        function takeDamage() {
            lives--;
            livesDisplay.innerText = lives;
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 100);
            if (lives <= 0) gameOver();
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 8 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: Math.random() * 6 + 3,
                    color: color, life: 1, decay: Math.random() * 0.03 + 0.02
                });
            }
        }

        function createFloatText(text, x, y, color) {
            floatTexts.push({ text: text, x: x, y: y, color: color, life: 1, vy: -2 });
        }

        function update() {
            if (!isPlaying) return;
            frameCount++;

            if (comboCount > 0 && Date.now() - lastSlashTime > COMBO_TIMEOUT) {
                finalizeCombo();
            }

            let difficultyCurve = Math.max(20, 70 - Math.floor(score / 35));
            if (frameCount % difficultyCurve === 0) {
                spawnTarget();
                if (score >= 150 && Math.random() > 0.5) {
                    spawnTarget();
                }
            }

            for (let i = targets.length - 1; i >= 0; i--) {
                let t = targets[i];
                t.vy += 0.25; 
                t.x += t.vx;
                t.y += t.vy;
                t.rotation += t.rotSpeed;

                if (t.x - (t.width/2) < 0 || t.x + (t.width/2) > 380) t.vx *= -1;

                if (t.y > 520) {
                    if (t.type === 'enemy') takeDamage(); 
                    targets.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.vy += 0.2; 
                p.x += p.vx; p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(i, 1);
            }

            for (let i = floatTexts.length - 1; i >= 0; i--) {
                let f = floatTexts[i];
                f.y += f.vy; f.life -= 0.02;
                if (f.life <= 0) floatTexts.splice(i, 1);
            }

            if (isSwiping && swipePath.length > 0) {
                trails.push({ path: [...swipePath], life: 1 });
            }
            for (let i = trails.length - 1; i >= 0; i--) {
                trails[i].life -= 0.15;
                if (trails[i].life <= 0) trails.splice(i, 1);
            }

            draw();
            gameLoop = requestAnimationFrame(update);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let t of trails) {
                if (t.path.length < 2) continue;
                ctx.beginPath();
                ctx.moveTo(t.path[0].x, t.path[0].y);
                for (let i = 1; i < t.path.length; i++) {
                    ctx.lineTo(t.path[i].x, t.path[i].y);
                }
                ctx.strokeStyle = `rgba(56, 189, 248, ${t.life})`;
                ctx.lineWidth = 6 * t.life;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
                
                ctx.strokeStyle = `rgba(255, 255, 255, ${t.life})`;
                ctx.lineWidth = 2 * t.life;
                ctx.stroke();
            }

            for (let t of targets) {
                ctx.save();
                ctx.translate(t.x, t.y);
                ctx.rotate(t.rotation);
                
                let grad = ctx.createLinearGradient(-t.width/2, -t.height/2, t.width/2, t.height/2);
                grad.addColorStop(0, t.c1);
                grad.addColorStop(1, t.c2);

                ctx.fillStyle = grad;
                ctx.strokeStyle = t.border;
                ctx.lineWidth = 3;

                let wobble = frameCount * 0.15; 

                if (t.id === 'kolesterol') {
                    drawRoundRect(ctx, -t.width/2, -t.height/2, t.width, t.height, 20); 
                } else if (t.id === 'asamurat') {
                    drawOrganicShape(ctx, t.width/2, t.height/2, wobble); 
                } else if (t.id === 'guladarah' || t.id === 'hipertensi') {
                    drawOrganicShape(ctx, t.width/2, t.height/2.2, wobble); 
                } else if (t.type === 'friendly') {
                    drawRoundRect(ctx, -t.width/2, -t.height/2, t.width, t.height, 6); 
                }
                
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.stroke();
                ctx.shadowBlur = 0;

                ctx.fillStyle = t.textColor;
                ctx.font = 'bold 9px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                let words = t.label.split(' ');
                if (words.length > 1) {
                    ctx.fillText(words[0], 0, -5);
                    ctx.fillText(words[1], 0, 7);
                } else {
                    ctx.fillText(t.label, 0, 0);
                }
                ctx.restore();
            }

            for (let p of particles) {
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            for (let f of floatTexts) {
                ctx.globalAlpha = Math.max(0, f.life);
                ctx.fillStyle = f.color;
                ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 4;
                ctx.fillText(f.text, f.x, f.y);
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(gameLoop);

            let finalRank = getRank(score);
            let newHighScoreMsg = '';
            
            if (score > savedHighScore) {
                savedHighScore = score;
                localStorage.setItem('sopSlasherHighScore', savedHighScore);
                menuHighScoreDisplay.innerText = savedHighScore;
                updateMenuWelcomeRank(savedHighScore);
                newHighScoreMsg = '<br><span style="color:#f59e0b; font-size:12px; display:inline-block; margin-top:4px; background:rgba(245,158,11,0.2); padding:2px 6px; border-radius:4px;">🎉 NEW HIGH SCORE! 🎉</span>';
            }

            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <h1 style="color: #ef4444; font-size: 24px;">GAME OVER</h1>
                <p style="color: #fff; margin-bottom: 20px; line-height: 1.6;">
                    Gelar Akhir: <b style="color:#38bdf8;">${finalRank}</b><br>
                    Skor Tebasan: <b class="text-gold" style="font-size:20px;">${score}</b><br>
                    🏆 High Score: <b style="color:#fbbf24;">${savedHighScore}</b>
                    ${newHighScoreMsg}
                </p>
                <button class="btn-start" id="restartBtn">Tebas Lagi 🔄</button>
            `;

            const restartBtn = document.getElementById('restartBtn');
            restartBtn.addEventListener('click', () => {
                let currentHighestRank = getRank(savedHighScore);
                overlay.innerHTML = `
                    <h1>SOP SLASHER</h1>
                    <div class="welcome-rank" id="menu-welcome-rank">Welcome, ${currentHighestRank}!</div>
                    <div class="high-score-box">🏆 High Score: <span id="menu-high-score">${savedHighScore}</span></div>
                    <div class="tutorial-box">
                        <div>⚔️ <b>CARA MAIN:</b> Swipe jari untuk menebas cepat!</div>
                        <div style="margin-top: 4px;">⚠️ <b>PERATURAN:</b></div>
                        <div style="margin-left: 10px; color: #60a5fa;">• Jangan tebas Sachet SOP (Biru Tua)</div>
                        <div style="margin-left: 10px; color: #c084fc;">• Jangan tebas Sachet Utsu (Ungu Tua)</div>
                        <div style="margin-top: 4px; color: #ef4444;"> Nahan kursor / diam menunggu musuh tidak akan menghitung combo!</div>
                    </div>
                    <button class="btn-start" id="startBtn">Mulai Tebas ⚔️</button>
                `;
                document.getElementById('startBtn').addEventListener('click', startGame);
                startGame();
            });
        }
    </script>
</body>
</html>
