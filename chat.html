<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEMY - Asisten Virtual AFC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; }
        .flex-col { display: flex; flex-direction: column; }
        .overflow-hidden { overflow: hidden; }
        
        .chat-box { 
            background-color: #e5ddd5; 
            flex: 1; 
            overflow-y: auto; 
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .msg.bot { background: #fff; align-self: flex-start; border-top-left-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg.user { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col h-[100dvh] overflow-hidden">

    <!-- MODAL POP-UP WAJIB ISI (Nama & No HP) -->
    <div id="authModal" class="fixed inset-0 z-[100] bg-black/60 flex items-center justify-center hidden backdrop-blur-sm p-4">
        
        <!-- BAGIAN INI YANG DITAMBAHIN: max-h-[85dvh] dan overflow-y-auto -->
        <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-sm transform transition-all max-h-[85dvh] overflow-y-auto">
            
            <div class="flex justify-center mb-4">
                <div class="bg-teal-100 p-3 rounded-full">
                    <span class="text-2xl">🤖</span>
                </div>
            </div>
            <h3 class="text-xl font-bold text-center text-teal-800 mb-1">Mulai Konsultasi</h3>
            <p class="text-sm text-center text-slate-500 mb-5">Silakan lengkapi data berikut agar JEMY bisa melayani dengan baik.</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Panggilan</label>
                    <input type="text" id="userNameInput" placeholder="Contoh: Budi" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl outline-none focus:border-teal-600 focus:bg-white transition text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nomor WhatsApp Aktif</label>
                    <input type="tel" id="userPhoneInput" placeholder="Contoh: 08123456789" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl outline-none focus:border-teal-600 focus:bg-white transition text-sm">
                </div>
                <button onclick="startChatAuth()" class="w-full bg-[#075e54] hover:bg-[#054c43] text-white font-bold py-3 rounded-xl transition shadow-lg mt-2 mb-2">Mulai Chat Sekarang</button>
            </div>

        </div>
    </div>

    <!-- HEADER UTAMA -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm flex-shrink-0">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center relative">
            <div class="flex items-center">
                <a href="index.html" class="flex items-center gap-2">
                    <img src="logo.png" alt="Logo AFC Life Science" class="h-9 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
                    <span id="fallback-logo" style="display: none;" class="font-bold text-lg text-blue-900">AFC Life Science</span>
                </a>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="resetChatHistory()" title="Mulai Percakapan Baru / Reset Chat" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1 border border-red-200">
                    🔄 Reset Chat
                </button>
                <button onclick="toggleMobileMenu()" id="menu-btn" class="text-slate-700 hover:text-blue-600 focus:outline-none p-2 rounded-lg transition bg-slate-100">
                    <svg id="icon-open" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    <svg id="icon-close" class="w-7 h-7 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Dropdown Menu Mobile -->
            <div id="mobile-menu" class="hidden absolute top-full right-4 mt-2 w-64 max-h-[75vh] overflow-y-auto bg-white rounded-2xl shadow-2xl border border-slate-200 p-3 transition-all z-50 origin-top-right">
                <div class="flex flex-col space-y-2">
                    <a href="index.html" class="block bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold px-4 py-3 rounded-xl text-sm transition">🏠 Beranda</a>
                    <a href="index.html#produk-satuan-section" class="block bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold px-4 py-3 rounded-xl text-sm transition">📦 Paket Satuan</a>
                    <a href="index.html#paket-member-section" class="block bg-blue-50 hover:bg-blue-100 text-blue-900 font-semibold px-4 py-3 rounded-xl text-sm transition">⭐ Paket Member</a>
                    <a href="testimoni.html" class="block bg-emerald-50 hover:bg-emerald-100 text-emerald-900 font-semibold px-4 py-3 rounded-xl text-sm transition">💬 Testimoni</a>
                    <a href="bisnis.html" class="block bg-amber-50 hover:bg-amber-100 text-amber-900 font-semibold px-4 py-3 rounded-xl text-sm transition">💼 Peluang Bisnis</a>
                    <a href="pertanyaan.html" class="block bg-purple-50 hover:bg-purple-100 text-purple-900 font-semibold px-4 py-3 rounded-xl text-sm transition">❓ FAQ</a>
                </div>
            </div>
        </div>
    </header>

    <!-- AREA CHAT UTAMA -->
    <main class="flex-1 flex justify-center items-center bg-[#e5ddd5] overflow-hidden p-0 sm:p-4" style="height: calc(100dvh - 65px);">
        <div class="chat-container w-full max-w-lg bg-white flex flex-col h-full sm:h-[88vh] sm:rounded-2xl sm:shadow-2xl overflow-hidden">
            
            <div class="bg-[#075e54] text-white p-3 font-bold flex items-center justify-between shadow-md flex-shrink-0">
                <span class="text-sm">🤖 JEMY - Konsultan Virtual AFC</span>
                <span class="text-xs bg-emerald-600 px-2.5 py-1 rounded-full font-normal">● Online</span>
            </div>

            <div class="chat-box flex-1 p-4 overflow-y-auto flex flex-col gap-3" id="chatBox"></div>

            <div class="loading text-xs text-slate-500 bg-[#e5ddd5] px-4 py-1 italic flex-shrink-0" id="loadingIndicator" style="display: none;">JEMY sedang mengetik...</div>

            <div class="input-area flex items-center p-3 pb-8 sm:pb-3 bg-[#f0f0f0] border-t border-slate-200 flex-shrink-0">
                <input type="text" id="userInput" placeholder="Ketik pesan atau command..." onkeypress="handleKeyPress(event)" class="flex-1 px-4 py-3 bg-white border border-slate-300 rounded-full outline-none focus:border-teal-600 text-sm">
                <button onclick="sendMessage()" class="bg-[#075e54] hover:bg-[#054c43] text-white px-5 py-3 ml-2 rounded-full font-bold text-sm transition shadow">Kirim</button>
            </div>
        </div>
    </main>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        const API_URL = "https://api.afc-lifescience.store/api/chat";
        
        let sessionId = localStorage.getItem("jemy_phone");
        let userName = localStorage.getItem("jemy_name");

        // 1. Logika Pop Up Awal
        window.addEventListener('DOMContentLoaded', () => {
            if (!sessionId || !userName) {
                document.getElementById('authModal').classList.remove('hidden');
            } else {
                loadChatHistory();
            }
        });

        // Format Otomatis Nomor HP
        function formatNomorHP(inputNomor) {
            let nomorBersih = inputNomor.replace(/\D/g, ''); // Hapus semua selain angka
            if (nomorBersih.startsWith('0')) return '62' + nomorBersih.slice(1);
            if (nomorBersih.startsWith('8')) return '62' + nomorBersih;
            return nomorBersih;
        }

        // Action Klik Tombol Form Modal
        function startChatAuth() {
            const nameInput = document.getElementById('userNameInput').value.trim();
            const phoneInput = document.getElementById('userPhoneInput').value.trim();
            
            // 1. Cek apakah kolom kosong
            if (!nameInput) {
                alert("Mohon isi Nama panggilan Kakak ya.");
                return;
            }
            if (!phoneInput) {
                alert("Mohon isi Nomor WhatsApp aktif Kakak.");
                return;
            }

            // 2. Bersihkan format nomor untuk dicek (otomatis ubah ke 62...)
            const cleanedPhone = formatNomorHP(phoneInput);
            
            // 3. Validasi ketat nomor HP Indonesia (Harus awalan 628 dan panjang 10-15 digit)
            if (!cleanedPhone.startsWith('628') || cleanedPhone.length < 10 || cleanedPhone.length > 15) {
                alert("⚠️ Format nomor WhatsApp tidak valid. Pastikan nomor benar dan berawalan 08... (Contoh: 08123456789).");
                return;
            }

            // Jika lolos validasi, simpan data dan mulai chat
            localStorage.setItem("jemy_phone", cleanedPhone);
            localStorage.setItem("jemy_name", nameInput);
            
            sessionId = cleanedPhone;
            userName = nameInput;
            
            document.getElementById('authModal').classList.add('hidden');
            loadChatHistory();
        }

        // Tampilan Navigasi Hamburger
        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
            document.getElementById('icon-open').classList.toggle('hidden');
            document.getElementById('icon-close').classList.toggle('hidden');
        }

        function formatText(text) {
            let formatted = text.replace(/\*(.*?)\*/g, "<b>$1</b>");
            return formatted.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color: #0284c7; text-decoration: underline; font-weight: 600;">$1</a>');
        }

        const defaultWelcomeMessage = `Halo Kak, saya JEMY asisten virtual AFC yang siap membantu.\n\nSilakan gunakan command berikut untuk bernavigasi:\n👉 *\\0* atau *\\menu* : Menu Utama`;

        function loadChatHistory() {
            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML = ""; 

            let history = JSON.parse(localStorage.getItem("jemy_chat_history_" + sessionId));
            
            if (!history || history.length === 0) {
                history = [{ sender: "bot", text: defaultWelcomeMessage }];
                localStorage.setItem("jemy_chat_history_" + sessionId, JSON.stringify(history));
            }

            history.forEach(item => {
                const msgDiv = document.createElement("div");
                msgDiv.className = "msg " + item.sender;
                msgDiv.innerHTML = formatText(item.text);
                chatBox.appendChild(msgDiv);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(sender, text, save = true) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = "msg " + sender;
            msgDiv.innerHTML = formatText(text);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (save) {
                let history = JSON.parse(localStorage.getItem("jemy_chat_history_" + sessionId)) || [];
                history.push({ sender: sender, text: text });
                localStorage.setItem("jemy_chat_history_" + sessionId, JSON.stringify(history));
            }
        }

        async function sendMessage() {
            if (!sessionId) return; // Cegah kirim kalau belum isi form

            const input = document.getElementById("userInput");
            let message = input.value.trim();
            if (!message) return;

            const lowerMsg = message.toLowerCase();
            if (lowerMsg === '\\menu' || lowerMsg === 'menu' || lowerMsg === '\\status' || lowerMsg === 'status') {
                message = '\\0';
            } else if (/^\d+$/.test(message)) {
                message = "\\" + message;
            }

            appendMessage("user", message);
            input.value = "";
            
            const loading = document.getElementById("loadingIndicator");
            loading.style.display = "block";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    // Kirim sessionId DAN userName ke bot.js
                    body: JSON.stringify({ sessionId: sessionId, userName: userName, message: message })
                });
                
                const data = await response.json();
                loading.style.display = "none";

                if (!data || !data.reply || data.reply.trim() === "") {
                    appendMessage("bot", "Maaf Kak, perintah tidak dikenali. Silakan ketik *\\0* untuk kembali ke Menu Utama.");
                } else {
                    appendMessage("bot", data.reply);
                }

            } catch (error) {
                loading.style.display = "none";
                appendMessage("bot", "Maaf, koneksi ke server sedang terganggu. Silakan hubungi admin jika masalah berlanjut.\nhttps://wa.me/6287828412340");
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") sendMessage();
        }

        function resetChatHistory() {
            if (confirm("Apakah Anda ingin mereset riwayat chat, mengganti Nama/No HP, dan memulai sesi baru?")) {
                localStorage.removeItem("jemy_chat_history_" + sessionId);
                localStorage.removeItem("jemy_phone");
                localStorage.removeItem("jemy_name");
                location.reload(); // Refresh halaman agar pop up form muncul lagi
            }
        }
    </script>
</body>
</html>
