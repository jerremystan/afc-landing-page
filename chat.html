<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEMY - Asisten Virtual AFC</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Pastikan body dan html full tinggi tanpa scroll luar */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; 
        }
        
        .flex-col { display: flex; flex-direction: column; }
        .overflow-hidden { overflow: hidden; }
        
        /* Styling Jendela Chat agar bisa scroll sendiri */
        .chat-box { 
            background-color: #e5ddd5; 
            flex: 1; 
            overflow-y: auto; 
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .msg.bot { background: #fff; align-self: flex-start; border-top-left-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg.user { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col h-[100dvh] overflow-hidden">

    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5QGKWNLG"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
     
    <!-- HEADER UTAMA DENGAN MENU DROPDOWN -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm flex-shrink-0">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center relative">
            <div class="flex items-center">
                <a href="index.html" class="flex items-center gap-2">
                    <img src="logo.png" alt="Logo AFC Life Science" class="h-9 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
                    <span id="fallback-logo" style="display: none;" class="font-bold text-lg text-blue-900">AFC Life Science</span>
                </a>
            </div>

            <!-- Tombol Aksi Kanan Header (Reset Chat & Menu) -->
            <div class="flex items-center gap-2">
                <button onclick="resetChatHistory()" title="Mulai Percakapan Baru / Reset Chat" class="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1 border border-red-200">
                    🔄 Reset Chat
                </button>
                <button onclick="toggleMobileMenu()" id="menu-btn" class="text-slate-700 hover:text-blue-600 focus:outline-none p-2 rounded-lg transition bg-slate-100">
                    <svg id="icon-open" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                    <svg id="icon-close" class="w-7 h-7 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Dropdown Menu Mobile (Ditambahkan max-h dan overflow agar aman saat landscape) -->
            <div id="mobile-menu" class="hidden absolute top-full right-4 mt-2 w-64 max-h-[75vh] overflow-y-auto bg-white rounded-2xl shadow-2xl border border-slate-200 p-3 transition-all duration-300 z-50 origin-top-right">
                <div class="flex flex-col space-y-2">
                    <a href="index.html" onclick="toggleMobileMenu()" class="block bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold px-4 py-3 rounded-xl text-left text-sm transition">
                        🏠 Beranda
                    </a>
                    <a href="index.html#produk-satuan-section" onclick="toggleMobileMenu()" class="block bg-slate-50 hover:bg-slate-100 text-slate-700 font-semibold px-4 py-3 rounded-xl text-left text-sm transition">
                        📦 Paket Satuan
                    </a>
                    <a href="index.html#paket-member-section" onclick="toggleMobileMenu()" class="block bg-blue-50 hover:bg-blue-100 text-blue-900 font-semibold px-4 py-3 rounded-xl text-left text-sm transition">
                        ⭐ Paket Member
                    </a>
                    <a href="testimoni.html" onclick="toggleMobileMenu()" class="block bg-emerald-50 hover:bg-emerald-100 text-emerald-900 font-semibold px-4 py-3 rounded-xl text-left text-sm transition">
                        💬 Testimoni
                    </a>
                    <a href="bisnis.html" onclick="toggleMobileMenu()" class="block bg-amber-50 hover:bg-amber-100 text-amber-900 font-semibold px-4 py-3 rounded-xl text-left text-sm transition">
                        💼 Peluang Bisnis
                    </a>
                    <a href="pertanyaan.html" onclick="toggleMobileMenu()" class="block bg-purple-50 hover:bg-purple-100 text-purple-900 font-semibold px-4 py-3 rounded-xl text-left text-sm transition">
                        ❓ FAQ
                    </a>
                    <a href="chat.html" onclick="toggleMobileMenu()" class="block bg-teal-600 hover:bg-teal-700 text-white font-semibold px-4 py-3 rounded-xl text-left text-sm transition shadow-sm">
                        🤖 Hubungi JEMY (VA)
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- AREA CHAT UTAMA -->
    <main class="flex-1 flex justify-center items-center bg-[#e5ddd5] overflow-hidden p-0 sm:p-4" style="height: calc(100dvh - 65px);">
        <div class="chat-container w-full max-w-lg bg-white flex flex-col h-full sm:h-[88vh] sm:rounded-2xl sm:shadow-2xl overflow-hidden">
            
            <!-- Header Kotak Chat (Dijamin tidak akan terpotong lagi) -->
            <div class="bg-[#075e54] text-white p-3 font-bold flex items-center justify-between shadow-md flex-shrink-0">
                <span class="text-sm">🤖 JEMY - Konsultan Virtual AFC</span>
                <span class="text-xs bg-emerald-600 px-2.5 py-1 rounded-full font-normal">● Online</span>
            </div>

            <!-- Jendela Chat -->
            <div class="chat-box flex-1 p-4 overflow-y-auto flex flex-col gap-3" id="chatBox">
                <!-- Chat akan dimuat otomatis lewat JavaScript (localStorage) -->
            </div>

            <!-- Indikator Loading -->
            <div class="loading text-xs text-slate-500 bg-[#e5ddd5] px-4 py-1 italic flex-shrink-0" id="loadingIndicator" style="display: none;">JEMY sedang mengetik...</div>

            <!-- Area Input Pengguna -->
            <div class="input-area flex items-center p-3 pb-8 sm:pb-3 bg-[#f0f0f0] border-t border-slate-200 flex-shrink-0">
                <input type="text" id="userInput" placeholder="Ketik pesan atau command (contoh: \menu, \0, 1)..." onkeypress="handleKeyPress(event)" class="flex-1 px-4 py-3 bg-white border border-slate-300 rounded-full outline-none focus:border-teal-600 text-sm">
                <button onclick="sendMessage()" class="bg-[#075e54] hover:bg-[#054c43] text-white px-5 py-3 ml-2 rounded-full font-bold text-sm transition shadow">Kirim</button>
            </div>
        </div>
    </main>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const iconOpen = document.getElementById('icon-open');
            const iconClose = document.getElementById('icon-close');
            
            menu.classList.toggle('hidden');
            iconOpen.classList.toggle('hidden');
            iconClose.classList.toggle('hidden');
        }

        window.addEventListener('click', function(e) {
            const menu = document.getElementById('mobile-menu');
            const menuBtn = document.getElementById('menu-btn');
            if (menu && menuBtn && !menu.contains(e.target) && !menuBtn.contains(e.target)) {
                menu.classList.add('hidden');
                document.getElementById('icon-open').classList.remove('hidden');
                document.getElementById('icon-close').classList.add('hidden');
            }
        });

        let sessionId = localStorage.getItem("jemy_session");
        if (!sessionId) {
            sessionId = "ID-" + Math.random().toString(36).substr(2, 9);
            localStorage.setItem("jemy_session", sessionId);
        }

        const API_URL = "https://api.afc-lifescience.store/api/chat";

        function formatText(text) {
            let formatted = text.replace(/\*(.*?)\*/g, "<b>$1</b>");
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            formatted = formatted.replace(urlRegex, '<a href="$1" target="_blank" style="color: #0284c7; text-decoration: underline; font-weight: 600;">$1</a>');
            return formatted;
        }

        // Pesan sambutan default bot
        const defaultWelcomeMessage = `Halo Kak, saya JEMY asisten virtual AFC yang siap membantu. 

Silakan gunakan command berikut untuk bernavigasi:
👉 *\\0* atau *\\menu* : Menu Utama`;

        // Load riwayat chat dari localStorage saat halaman dibuka/refresh
        window.addEventListener('DOMContentLoaded', () => {
            loadChatHistory();
        });

        function loadChatHistory() {
            const chatBox = document.getElementById("chatBox");
            chatBox.innerHTML = ""; // Bersihkan kontainer

            let history = JSON.parse(localStorage.getItem("jemy_chat_history_" + sessionId));
            
            // Jika belum ada riwayat sama sekali, buat riwayat baru dengan pesan sambutan bot
            if (!history || history.length === 0) {
                history = [{ sender: "bot", text: defaultWelcomeMessage }];
                localStorage.setItem("jemy_chat_history_" + sessionId, JSON.stringify(history));
            }

            // Render semua pesan ke layar
            history.forEach(item => {
                const msgDiv = document.createElement("div");
                msgDiv.className = "msg " + item.sender;
                msgDiv.innerHTML = formatText(item.text);
                chatBox.appendChild(msgDiv);
            });

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function saveMessageToHistory(sender, text) {
            let history = JSON.parse(localStorage.getItem("jemy_chat_history_" + sessionId)) || [];
            history.push({ sender: sender, text: text });
            localStorage.setItem("jemy_chat_history_" + sessionId, JSON.stringify(history));
        }

        function appendMessage(sender, text, save = true) {
            const chatBox = document.getElementById("chatBox");
            const msgDiv = document.createElement("div");
            msgDiv.className = "msg " + sender;
            msgDiv.innerHTML = formatText(text);
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (save) {
                saveMessageToHistory(sender, text);
            }
        }

        async function sendMessage() {
            const input = document.getElementById("userInput");
            let message = input.value.trim();
            if (!message) return;

            // Mapping command di frontend
            const lowerMsg = message.toLowerCase();
            if (lowerMsg === '\\menu' || lowerMsg === 'menu') {
                message = '\\0';
            } else if (lowerMsg === '\\status' || lowerMsg === 'status') {
                message = '\\0'; 
            } else if (/^\d+$/.test(message)) {
                message = "\\" + message;
            }

            appendMessage("user", message);
            input.value = "";
            
            const loading = document.getElementById("loadingIndicator");
            loading.style.display = "block";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ sessionId: sessionId, message: message })
                });
                
                const data = await response.json();
                loading.style.display = "none";

                // Auto-fallback jika server membalas kosong / tidak valid
                if (!data || !data.reply || data.reply.trim() === "") {
                    const fallbackRes = await fetch(API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ sessionId: sessionId, message: "\\0" })
                    });
                    const fallbackData = await fallbackRes.json();
                    const replyText = fallbackData.reply || "Maaf Kak, perintah tidak dikenali. Silakan ketik *\\0* untuk kembali ke Menu Utama.";
                    appendMessage("bot", replyText);
                } else {
                    appendMessage("bot", data.reply);
                }

            } catch (error) {
                loading.style.display = "none";
                appendMessage("bot", "Maaf, koneksi ke server sedang terganggu. Silakan ketik *\\0* atau *\\menu* untuk kembali ke Menu Utama.\nHubungi admin jika masalah berlanjut.\nhttps://wa.me/6287828412340");
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") sendMessage();
        }

        // Fungsi untuk mereset chat history jika ingin mulai percakapan baru
        function resetChatHistory() {
            if (confirm("Apakah Anda ingin mereset riwayat chat dan memulai sesi baru?")) {
                localStorage.removeItem("jemy_chat_history_" + sessionId);
                // Buat sessionId baru agar bersih total
                sessionId = "ID-" + Math.random().toString(36).substr(2, 9);
                localStorage.setItem("jemy_session", sessionId);
                loadChatHistory();
            }
        }
    </script>
</body>
</html>
