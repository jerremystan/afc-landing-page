<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOP Virus Defender - AFC Game</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
        body {
            margin: 0; padding: 0; background: #0f172a; color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden;
        }
        #game-wrapper {
            width: 100%; max-width: 380px; background: #1e293b; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); border: 2px solid #fbbf24;
            overflow: hidden; display: flex; flex-direction: column; position: relative;
        }

        /* HEADER DISEMPURNAKAN DENGAN FLEXBOX AGAR TERSUSUN SEMPURNA SECARA VERTIKAL */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: #0f172a;
            font-size: 11px; font-weight: bold; border-bottom: 2px solid #fbbf24; z-index: 25;
        }

        .btn-back {
            background: rgba(15, 23, 42, 0.8); color: #fbbf24;
            border: 1px solid #fbbf24; padding: 4px 10px;
            font-size: 11px; font-weight: bold; border-radius: 6px;
            text-decoration: none; box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: transform 0.1s; display: inline-flex; align-items: center;
        }
        .btn-back:active { transform: scale(0.95); }

        .header-stats {
            display: flex; gap: 10px; align-items: center;
        }

        .text-gold { color: #fbbf24; text-shadow: 1px 1px 2px #000; font-size: 13px;}
        #weapon-status { color: #c084fc; font-weight: 900; letter-spacing: 1px; }

        #game-area {
            position: relative; width: 100%; height: 520px;
            background: radial-gradient(circle at top, #1e293b, #040812);
            overflow: hidden; cursor: pointer;
        }

        .star {
            position: absolute; background: rgba(255, 255, 255, 0.4);
            border-radius: 50%; animation: starFall linear infinite;
        }
        @keyframes starFall {
            from { transform: translateY(-10px); }
            to { transform: translateY(520px); }
        }

        /* PESAWAT SOP */
        #player {
            position: absolute; bottom: 20px; left: 160px;
            width: 50px; height: 60px;
            background: linear-gradient(to bottom, #38bdf8, #1d4ed8);
            clip-path: polygon(50% 0%, 100% 70%, 80% 100%, 50% 80%, 20% 100%, 0% 70%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-weight: 900; font-size: 11px; padding-bottom: 12px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
            z-index: 15; transition: transform 0.1s;
        }
        #player.evolved {
            background: linear-gradient(to bottom, #fef08a, #f59e0b, #b45309);
            clip-path: polygon(50% 0%, 100% 40%, 100% 100%, 80% 80%, 50% 100%, 20% 80%, 0% 100%, 0% 40%);
            color: #fff; text-shadow: 0 0 4px #000;
        }

        /* Power Up Utsu Drop */
        .utsu-drop {
            position: absolute; width: 32px; height: 32px;
            background: radial-gradient(circle, #d8b4fe, #7e22ce);
            border: 2px solid #fbbf24; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fbbf24; font-weight: 900; font-size: 11px;
            box-shadow: 0 0 15px #a855f7; z-index: 14;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 10px #a855f7; }
            100% { transform: scale(1.1); box-shadow: 0 0 25px #d8b4fe; }
        }

        .laser {
            position: absolute; width: 4px; height: 20px;
            background: #38bdf8; border-radius: 4px;
            box-shadow: 0 0 8px #38bdf8, 0 0 15px #fbbf24; z-index: 10;
        }
        .laser.super { background: #fbbf24; width: 6px; box-shadow: 0 0 12px #fbbf24, 0 0 20px #f59e0b; }

        .virus {
            position: absolute; width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center; text-align: center;
            color: #fff; font-size: 9px; font-weight: bold; letter-spacing: 0.5px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 0 15px rgba(0,0,0,0.8);
            z-index: 12;
            animation: morph 2.5s linear infinite;
        }
        @keyframes morph {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
            67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
        }
        .hp-bar { position: absolute; bottom: 6px; font-size: 8px; color: #fbbf24; }

        .particle {
            position: absolute; border-radius: 50%; pointer-events: none; z-index: 20;
            animation: burst 0.4s cubic-bezier(0, 0.7, 0.2, 1) forwards;
        }
        @keyframes burst {
            0% { transform: translate(0,0) scale(1.5); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
        }

        #ui-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); z-index: 30;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 15px 20px;
        }
        h1 { color: #38bdf8; margin-bottom: 2px; font-size: 24px; text-shadow: 0 0 10px rgba(56,189,248,0.5); }
        p { color: #e2e8f0; font-size: 11px; margin-bottom: 12px; line-height: 1.4; }
        
        .record-box {
            background: rgba(251, 191, 36, 0.15); border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fbbf24; padding: 5px 14px; border-radius: 20px; font-size: 11px; font-weight: bold;
            margin-bottom: 12px; display: flex; gap: 12px; justify-content: center;
        }

        .difficulty-container {
            display: flex; gap: 8px; margin-bottom: 15px; width: 100%; max-width: 280px; justify-content: center;
        }
        .btn-diff {
            flex: 1; padding: 6px 0; font-size: 11px; font-weight: bold; border-radius: 8px;
            cursor: pointer; border: 2px solid #334155; background: #1e293b; color: #94a3b8;
            transition: all 0.2s;
        }
        .btn-diff.active {
            border-color: #fbbf24; background: rgba(251, 191, 36, 0.15); color: #fbbf24;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
        }

        .btn-start {
            background: linear-gradient(to bottom, #f59e0b, #d97706);
            color: white; border: none; padding: 10px 30px; font-size: 15px; font-weight: bold;
            border-radius: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.5);
            border: 2px solid #fbbf24;
        }
        .btn-start:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <!-- HEADER DENGAN TATA LETAK FLEXBOX YANG RAPI & CENTER SECARA VERTIKAL -->
        <div class="header">
            <a href="#" onclick="if (document.referrer) { history.back(); } else { window.location.href = 'index.html'; } return false;" class="btn-back">⬅ Kembali</a>
            
            <div class="header-stats">
                <div>Lv: <span id="weapon-status">1</span>/10</div>
                <div>Skor: <span id="score" class="text-gold">0</span></div>
                <div>Umur: <span id="age-display" class="text-gold">25 <span style="font-size:10px;">jt thn chy</span></span></div>
            </div>
        </div>

        <div id="game-area">
            <div id="player">SOP</div>
            
            <div id="ui-overlay">
                <h1>VIRUS DEFENDER</h1>
                <p>Basmi penyakit & capai umur hingga <b>80+ jt tahun cahaya</b>!</p>
                
                <div class="record-box">
                    <span>🏆 High Score: <b id="menu-high-score">0</b></span>
                    <span>⏳ Max Age: <b id="menu-high-age">25 jt</b></span>
                </div>

                <div class="difficulty-container">
                    <button class="btn-diff" data-diff="easy">Easy</button>
                    <button class="btn-diff active" data-diff="normal">Normal</button>
                    <button class="btn-diff" data-diff="hard">Hard</button>
                </div>

                <button class="btn-start" id="startBtn">Mulai Basmi 🚀</button>
            </div>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score');
        const ageDisplay = document.getElementById('age-display');
        const weaponStatus = document.getElementById('weapon-status');
        const overlay = document.getElementById('ui-overlay');
        const startBtn = document.getElementById('startBtn');
        const diffButtons = document.querySelectorAll('.btn-diff');
        const menuHighScore = document.getElementById('menu-high-score');
        const menuHighAge = document.getElementById('menu-high-age');

        let isPlaying = false;
        let gameLoop;
        let frameCount = 0;
        let score = 0;
        let weaponLevel = 1; 
        let baseAge = 25; 
        let currentDifficulty = 'normal';

        let highScore = parseInt(localStorage.getItem('sopVirusHighScore')) || 0;
        let highAge = parseInt(localStorage.getItem('sopVirusHighAge')) || 25;

        menuHighScore.innerText = highScore;
        menuHighAge.innerText = `${highAge} jt`;

        let playerX = 160; 
        const playerWidth = 50;
        const playerHeight = 60;
        const gameWidth = gameArea.clientWidth || 360;
        
        let lasers = [];
        let viruses = [];
        let utsus = [];
        let stars = [];

        const diffSettings = {
            easy:   { virusSpeedMul: 0.75, hpDiv: 60, spawnRateBase: 100, utsuInterval: 300 },
            normal: { virusSpeedMul: 0.95, hpDiv: 45, spawnRateBase: 85,  utsuInterval: 500 },
            hard:   { virusSpeedMul: 1.00, hpDiv: 40, spawnRateBase: 80,  utsuInterval: 600 }
        };

        diffButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                diffButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDifficulty = btn.getAttribute('data-diff');
            });
        });

        const virusTypes = [
            { label: "KOLESTEROL", bg: "radial-gradient(circle, #f97316, #7c2d12)" },
            { label: "ASAM URAT", bg: "radial-gradient(circle, #a855f7, #4c1d95)" },
            { label: "GULA DARAH", bg: "radial-gradient(circle, #ef4444, #7f1d1d)" },
            { label: "HIPERTENSI", bg: "radial-gradient(circle, #06b6d4, #164e63)" }
        ];

        function initStars() {
            for (let i = 0; i < 20; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                let size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * gameWidth + 'px';
                star.style.top = Math.random() * 520 + 'px';
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                star.style.animationDelay = (Math.random() * 2) + 's';
                gameArea.appendChild(star);
                stars.push(star);
            }
        }
        initStars();

        gameArea.addEventListener('touchmove', (e) => {
            if (!isPlaying) return;
            e.preventDefault();
            let touch = e.touches[0];
            let rect = gameArea.getBoundingClientRect();
            playerX = touch.clientX - rect.left - (playerWidth / 2);
            playerX = Math.max(0, Math.min(playerX, gameWidth - playerWidth));
            player.style.left = playerX + 'px';
        });

        let isDragging = false;
        gameArea.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        gameArea.addEventListener('mousemove', (e) => {
            if (!isPlaying || !isDragging) return;
            let rect = gameArea.getBoundingClientRect();
            playerX = e.clientX - rect.left - (playerWidth / 2);
            playerX = Math.max(0, Math.min(playerX, gameWidth - playerWidth));
            player.style.left = playerX + 'px';
        });

        startBtn.addEventListener('click', startGame);
        startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); });

        function startGame() {
            document.querySelectorAll('.laser, .virus, .utsu-drop').forEach(el => el.remove());
            lasers = [];
            viruses = [];
            utsus = [];
            score = 0;
            weaponLevel = 1;
            frameCount = 0;
            player.className = ''; 
            player.innerHTML = 'SOP';
            weaponStatus.innerText = weaponLevel;
            weaponStatus.style.color = '#c084fc';
            
            playerX = (gameWidth / 2) - (playerWidth / 2);
            player.style.left = playerX + 'px';
            scoreDisplay.innerText = score;
            updateAgeDisplay();
            
            overlay.style.display = 'none';
            isPlaying = true;
            
            if (gameLoop) cancelAnimationFrame(gameLoop);
            gameLoop = requestAnimationFrame(update);
        }

        function updateAgeDisplay() {
            let currentAge = baseAge + Math.floor(frameCount / 60);
            ageDisplay.innerHTML = `${currentAge} <span style="font-size:10px;">jt thn chy</span>`;
        }

        function shootLaser() {
            let numLasers = Math.min(Math.floor((weaponLevel - 1) / 2) + 1, 5); 
            let spread = 10;
            let isSuper = weaponLevel >= 8; 
            
            let startX = playerX + (playerWidth / 2) - 2; 
            let startY = 520 - 30 - playerHeight; 
            let offset = -((numLasers - 1) * spread) / 2;

            for (let i = 0; i < numLasers; i++) {
                let laser = document.createElement('div');
                laser.className = isSuper ? 'laser super' : 'laser';
                let lx = startX + offset + (i * spread);
                
                laser.style.left = lx + 'px';
                laser.style.top = startY + 'px';
                gameArea.appendChild(laser);
                
                lasers.push({ el: laser, x: lx, y: startY, width: isSuper ? 6 : 4, height: 20 });
            }
        }

        function spawnVirus() {
            let virus = document.createElement('div');
            virus.className = 'virus';
            let vData = virusTypes[Math.floor(Math.random() * virusTypes.length)];
            
            let vWidth = 55;
            let vx = Math.random() * (gameWidth - vWidth);
            let vy = -60; 

            virus.style.left = vx + 'px';
            virus.style.top = vy + 'px';
            virus.style.background = vData.bg;
            
            let cfg = diffSettings[currentDifficulty];
            let hp = 1 + Math.floor(score / cfg.hpDiv);
            
            virus.innerHTML = `${vData.label}<br><span class="hp-bar">♥ ${hp}</span>`;
            gameArea.appendChild(virus);
            
            viruses.push({ el: virus, x: vx, y: vy, width: vWidth, height: vWidth, hp: hp, maxHp: hp });
        }

        function spawnUtsuDrop() {
            let utsu = document.createElement('div');
            utsu.className = 'utsu-drop';
            utsu.innerText = 'U';
            
            let uWidth = 32;
            let ux = Math.random() * (gameWidth - uWidth);
            let uy = -40;

            utsu.style.left = ux + 'px';
            utsu.style.top = uy + 'px';
            gameArea.appendChild(utsu);

            utsus.push({ el: utsu, x: ux, y: uy, width: uWidth, height: uWidth });
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                let p = document.createElement('div');
                p.className = 'particle';
                p.style.left = (x + 25) + 'px';
                p.style.top = (y + 25) + 'px';
                
                let size = Math.random() * 5 + 2;
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = (i % 3 === 0) ? '#ffffff' : color;
                p.style.boxShadow = `0 0 8px ${p.style.background}`;

                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 50 + 10;
                p.style.setProperty('--dx', (Math.cos(angle) * speed) + 'px');
                p.style.setProperty('--dy', (Math.sin(angle) * speed) + 'px');

                gameArea.appendChild(p);
                setTimeout(() => p.remove(), 400);
            }
        }

        function update() {
            if (!isPlaying) return;
            frameCount++;
            updateAgeDisplay();

            let cfg = diffSettings[currentDifficulty];

            let fireRate = Math.max(6, 12 - Math.floor(weaponLevel / 2));
            if (frameCount % fireRate === 0) {
                shootLaser();
            }

            let spawnRate = Math.max(25, cfg.spawnRateBase - Math.floor(score / 3.5)); 
            if (frameCount % spawnRate === 0) {
                spawnVirus();
            }

            if (frameCount % cfg.utsuInterval === 0 && weaponLevel < 10) {
                spawnUtsuDrop();
            }

            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                l.y -= 12; 
                l.el.style.top = l.y + 'px';

                if (l.y < -20) {
                    l.el.remove();
                    lasers.splice(i, 1);
                }
            }

            for (let i = utsus.length - 1; i >= 0; i--) {
                let u = utsus[i];
                u.y += 2.2;
                u.el.style.top = u.y + 'px';

                let playerTop = 520 - 20 - playerHeight;
                
                if (
                    playerX < u.x + u.width &&
                    playerX + playerWidth > u.x &&
                    playerTop < u.y + u.height &&
                    playerTop + playerHeight > u.y
                ) {
                    weaponLevel = Math.min(weaponLevel + 1, 10);
                    
                    if (weaponLevel === 10) {
                        weaponStatus.innerText = "MAX";
                        weaponStatus.style.color = "#fbbf24"; 
                        player.className = "evolved"; 
                        player.innerHTML = "SOP<br>MAX";
                    } else {
                        weaponStatus.innerText = weaponLevel;
                    }
                    
                    gameArea.style.boxShadow = "inset 0 0 40px #a855f7";
                    setTimeout(() => gameArea.style.boxShadow = "none", 150);

                    u.el.remove();
                    utsus.splice(i, 1);
                    continue;
                }

                if (u.y > 520) {
                    u.el.remove();
                    utsus.splice(i, 1);
                }
            }

            let virusSpeed = Math.min((1.0 + (score * 0.009)) * cfg.virusSpeedMul, 4.5); 

            for (let i = viruses.length - 1; i >= 0; i--) {
                let v = viruses[i];
                v.y += virusSpeed;
                v.el.style.top = v.y + 'px';

                let playerTop = 520 - 20 - playerHeight;
                
                if (
                    playerX < v.x + v.width - 8 &&
                    playerX + playerWidth - 8 > v.x &&
                    playerTop < v.y + v.height - 8 &&
                    playerTop + playerHeight - 8 > v.y
                ) {
                    return gameOver();
                }

                if (v.y > 520) {
                    return gameOver();
                }
            }

            for (let i = lasers.length - 1; i >= 0; i--) {
                let l = lasers[i];
                let hit = false;

                for (let j = viruses.length - 1; j >= 0; j--) {
                    let v = viruses[j];

                    if (
                        l.x < v.x + v.width &&
                        l.x + l.width > v.x &&
                        l.y < v.y + v.height &&
                        l.y + l.height > v.y
                    ) {
                        hit = true;
                        let damage = Math.ceil(weaponLevel / 2);
                        v.hp -= damage;
                        
                        v.el.style.filter = 'brightness(2)';
                        setTimeout(() => { if(v.el) v.el.style.filter = 'none'; }, 100);
                        
                        v.el.innerHTML = `${v.el.innerHTML.split('<br>')[0]}<br><span class="hp-bar">♥ ${Math.max(v.hp, 0)}</span>`;

                        if (v.hp <= 0) {
                            let colorStr = v.el.style.background; 
                            let extColor = '#ef4444'; 
                            if(colorStr.includes('#f97316')) extColor = '#f97316';
                            if(colorStr.includes('#a855f7')) extColor = '#a855f7';
                            if(colorStr.includes('#06b6d4')) extColor = '#06b6d4';

                            createExplosion(v.x, v.y, extColor);
                            v.el.remove();
                            viruses.splice(j, 1);
                            score += 5;
                            scoreDisplay.innerText = score;
                        }
                        break; 
                    }
                }

                if (hit) {
                    l.el.remove();
                    lasers.splice(i, 1);
                }
            }

            gameLoop = requestAnimationFrame(update);
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(gameLoop);

            let finalAge = baseAge + Math.floor(frameCount / 60);
            let isNewRecord = false;

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('sopVirusHighScore', highScore);
                isNewRecord = true;
            }

            if (finalAge > highAge) {
                highAge = finalAge;
                localStorage.setItem('sopVirusHighAge', highAge);
                isNewRecord = true;
            }

            menuHighScore.innerText = highScore;
            menuHighAge.innerText = `${highAge} jt`;

            let recordMsg = isNewRecord ? '<br><span style="color:#f59e0b; font-size:11px; background:rgba(245,158,11,0.2); padding:2px 8px; border-radius:4px; display:inline-block; margin-top:4px;">🎉 REKOR BARU! 🎉</span>' : '';

            overlay.style.display = 'flex';
            overlay.innerHTML = `
                <h1 style="color: #ef4444; font-size: 26px;">TERINFEKSI!</h1>
                <p style="color: #fff; margin-bottom: 15px; line-height: 1.5;">
                    Usia Tercapai: <b class="text-gold">${finalAge} jt thn chy</b><br>
                    Mode: <b style="color:#38bdf8; text-transform: uppercase;">${currentDifficulty}</b> | Level: <b style="color:#c084fc;">${weaponLevel === 10 ? 'MAX' : weaponLevel}</b><br>
                    Skor Basmi: <b class="text-gold" style="font-size:16px;">${score}</b><br>
                    🏆 High Score: <b style="color:#fbbf24;">${highScore}</b> | ⏳ Max Age: <b style="color:#fbbf24;">${highAge} jt</b>
                    ${recordMsg}
                </p>
                <button class="btn-start" id="restartBtn">Basmi Ulang 🔄</button>
            `;

            const restartBtn = document.getElementById('restartBtn');
            restartBtn.addEventListener('click', () => {
                overlay.innerHTML = `
                    <h1>VIRUS DEFENDER</h1>
                    <p>Basmi penyakit & capai umur hingga <b>80+ jt tahun cahaya</b>!</p>
                    <div class="record-box">
                        <span>🏆 High Score: <b id="menu-high-score">${highScore}</b></span>
                        <span>⏳ Max Age: <b id="menu-high-age">${highAge} jt</b></span>
                    </div>
                    <div class="difficulty-container">
                        <button class="btn-diff" data-diff="easy">Easy</button>
                        <button class="btn-diff active" data-diff="normal">Normal</button>
                        <button class="btn-diff" data-diff="hard">Hard</button>
                    </div>
                    <button class="btn-start" id="startBtn">Mulai Basmi 🚀</button>
                `;
                document.querySelectorAll('.btn-diff').forEach(btn => {
                    if(btn.getAttribute('data-diff') === currentDifficulty) btn.classList.add('active');
                    else btn.classList.remove('active');
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.btn-diff').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentDifficulty = btn.getAttribute('data-diff');
                    });
                });
                document.getElementById('startBtn').addEventListener('click', startGame);
                startGame();
            });
            restartBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); });
        }
    </script>
</body>
</html>
